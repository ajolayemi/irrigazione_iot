name: Trigger Supabase Archiving Functions

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  call-functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [
          "archive-board-status",
          "archive-collector-pressure",
          "archive-pump-flow",
          "archive-pump-pressure",
          "archive-pump-status",
          "archive-sector-pressure",
          "archive-sector-status",
          "archive-terminal-pressure"
        ]

    steps:
      - name: Call Supabase function ${{ matrix.function }}
        run: |
          echo "Calling ${{ matrix.function }}"
          RESPONSE=$(curl -s -w "%{http_code}" -o body.txt -X POST \
            "https://${PROJECT_REF}.functions.supabase.co/${{ matrix.function }}" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

          STATUS_CODE="${RESPONSE: -3}"
          BODY=$(cat body.txt | jq -Rs .)

          echo "{\"function\": \"${{ matrix.function }}\", \"status\": \"$STATUS_CODE\", \"body\": $BODY}" > $GITHUB_WORKSPACE/${{ matrix.function }}.json

          if [[ "$STATUS_CODE" != "200" ]]; then
            echo "Function ${{ matrix.function }} failed with status $STATUS_CODE"
            exit 1
          fi
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  collect-responses:
    runs-on: ubuntu-latest
    needs: call-functions

    steps:
      - name: Checkout repo (required for workspace context)
        uses: actions/checkout@v4

      - name: Download response files from previous jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect JSON response files
        run: |
          echo "[" > responses.json
          FIRST=true
          for file in artifacts/**/*.json; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> responses.json
            fi
            cat "$file" >> responses.json
          done
          echo "]" >> responses.json

      - name: Upload combined responses as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-function-responses
          path: responses.json
